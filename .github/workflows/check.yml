name: Проверка сдачи

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Комплект второй темы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-тесты проверки
        run: python -m unittest discover -s checks -p 'test_*.py' -v
      - name: Проверить комплект сдачи
        run: python checks/check_submission.py
